<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#132f35" />
    <title>Connexion · Copilote Entretien</title>
    <link rel="icon" href="/copilote.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/ui.css" />
    <link rel="stylesheet" href="/espace.css" />
  </head>
  <body class="desk auth">
    <main class="signin">
      <a href="/" class="brand"
        ><img src="/copilote.svg" alt="" width="34" height="34" />Copilote
        Entretien</a
      >
      <section class="card">
        <h1 id="title">Connexion à Copilote</h1>
        <div id="providers" hidden></div>
        <button type="button" id="emailMode" hidden>
          Continuer avec un e-mail
        </button>
        <form id="authform">
          <div id="names" class="cols" hidden>
            <label
              >Prénom<input
                name="first_name"
                autocomplete="given-name"
                maxlength="100" /></label
            ><label
              >Nom<input
                name="last_name"
                autocomplete="family-name"
                maxlength="100"
            /></label>
          </div>
          <label
            >Adresse e-mail<input
              name="email"
              type="email"
              autocomplete="email"
              required
              maxlength="254"
          /></label>
          <label
            >Mot de passe<input
              name="password"
              type="password"
              autocomplete="current-password"
              required
              maxlength="200"
          /></label>
          <label id="confirm" hidden
            >Confirmer le mot de passe<input
              name="password_confirmation"
              type="password"
              autocomplete="new-password"
          /></label>
          <div id="registrationTerms" hidden>
            <label class="check-line"><input type="checkbox" name="accept_terms"> <span>J’accepte les <a href="/cgu.html" target="_blank" rel="noopener">CGU</a> et j’ai lu la <a href="/confidentialite.html" target="_blank" rel="noopener">politique de confidentialité</a>.</span></label>
            <label>Code d’invitation (si demandé)<input name="invitation_code" autocomplete="off" maxlength="128"></label>
          </div>
          <button class="primary" id="submit">Se connecter</button>
        </form>
        <p role="status" id="status"></p>
        <a id="forgot" href="/mot-de-passe.html">Mot de passe oublié ?</a>
        <hr />
        <a id="toggle" href="#inscription">Créer mon compte</a>
      </section>
    </main>
    <script type="module" src="/connexion.js"></script>
  <footer class="legal-footer"><nav aria-label="Informations légales"><a href="/cgu.html">CGU</a><a href="/cgv.html">CGV</a><a href="/confidentialite.html">Confidentialité</a><a href="/mentions-legales.html">Mentions légales</a><a href="mailto:mdiabate04@icloud.com?subject=Retour%20sur%20la%20b%C3%AAta">Donner mon avis</a></nav></footer><script defer src="/analytics.js"></script></body>
</html>
