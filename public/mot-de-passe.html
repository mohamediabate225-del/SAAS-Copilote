<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mot de passe · Copilote Entretien</title>
  <link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/espace.css"></head>
<body class="desk auth"><main class="signin"><a href="/dashboard.html" class="brand"><img src="/copilote.svg" width="34" height="34" alt="">Copilote Entretien</a><section class="card"><h1 id="reset-title">Mot de passe oublié ?</h1><p id="status" role="status" tabindex="-1"></p><form class="form-stack" id="request">
      <p>Indiquez votre adresse email pour recevoir un lien de réinitialisation.</p>
      <label>Adresse email<input name="email" type="email" autocomplete="email" required></label>
      <button class="action">Envoyer le lien</button>
    </form>
    <form class="form-stack" id="reset" hidden>
      <label>Nouveau mot de passe<input name="password" type="password" minlength="10" maxlength="200" autocomplete="new-password" aria-describedby="password-hint" required></label>
      <p class="field-hint" id="password-hint">Au moins 10 caractères.</p>
      <label>Confirmer le mot de passe<input name="password_confirmation" type="password" minlength="10" maxlength="200" autocomplete="new-password" required></label>
      <button class="action">Modifier le mot de passe</button>
    </form>
  <a href="/connexion.html">Retour à la connexion</a></section></main><script type="module" src="/mot-de-passe.js"></script>
</body>
</html>
