<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copilote Entretien</title><link rel="stylesheet" href="panel.css"></head>
<body><header><span class="logo">c</span><div><strong>Copilote Entretien</strong><small>Votre espace de préparation</small></div></header>
<main><details><summary>Mon profil et le poste</summary><div class="fields"><button id="syncAccount" class="secondary" type="button" style="margin-top:0;font-size:13px;padding:8px 12px;min-height:36px">🔄 Synchroniser avec mon compte local</button><div id="syncStatus" class="hint" style="color:#2447f5"></div><label>Poste visé<input id="role" placeholder="Ex. Acheteur junior"></label><label>Entreprise<input id="company"></label><label>CV ou résumé du parcours<textarea id="profile" rows="7" placeholder="Vos expériences, compétences et réalisations"></textarea></label><label>Langue des réponses<select id="language"><option value="auto">Langue de la question</option><option value="fr">Français</option><option value="en">Anglais</option></select></label><p class="hint">Enregistré sur cet ordinateur dans l’extension.</p></div></details>
<p class="hint">Informez les participants et obtenez leur accord avant de capturer le son. Sélectionnez l’onglet Teams et cochez « partager l’audio ».</p>
<button id="record" type="button">● &nbsp; Enregistrer une question</button><p id="status" role="status" aria-live="polite">Prêt à enregistrer.</p>
<section id="result" hidden><label>Question transcrite<textarea id="question" rows="3"></textarea></label><button id="retry" class="secondary" type="button">Générer à nouveau</button><div class="answer"><span>RÉPONSE SUGGÉRÉE</span><p id="answer" aria-live="polite"></p></div></section>
</main><script src="panel.js"></script></body></html>
